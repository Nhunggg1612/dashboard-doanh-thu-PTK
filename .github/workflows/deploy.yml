name: Deploy Quarto to Netlify

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'   # 8:00 sáng giờ VN
    - cron: '0 7 * * *'   # 2:00 chiều
    - cron: '0 10 * * *'  # 5:00 chiều
  workflow_dispatch:

# Không cho 2 lượt chạy chồng nhau (bấm Run nhiều lần / trùng giờ lịch)
concurrency:
  group: deploy-netlify
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # quá 30 phút thì tự dừng, không treo mãi
    # Image có sẵn R 4.4.0 + tidyverse + các thư viện hệ thống đi kèm
    # -> không phải cài R, không phải apt-get hàng trăm gói mỗi lần chạy
    container: rocker/tidyverse:4.4.0

    env:
      # Gói R dạng binary (cài nhanh, không phải biên dịch)
      CRAN_REPO: https://p3m.dev/cran/__linux__/jammy/latest
      QUARTO_VERSION: 1.7.32
      PKG_SYSREQS: "false"   # không cho pak tự apt-get cài hàng trăm gói -dev

    steps:
      - uses: actions/checkout@v4

      - name: Cài Quarto (tải bằng R, không cần apt-get)
        timeout-minutes: 5
        run: |
          # Đổi kho Ubuntu sang mirror của Azure (nhanh, ổn định hơn archive.ubuntu.com)
          # -> dùng cho bước apt nhỏ phía sau
          sed -i 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g; s|http://security.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list || true
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' > /etc/apt/apt.conf.d/99retry

          Rscript -e "options(timeout = 300); download.file('https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.deb', '/tmp/quarto.deb', mode = 'wb')"
          dpkg -i /tmp/quarto.deb
          quarto --version
          echo "options(repos = c(CRAN = '${CRAN_REPO}'))" >> /usr/local/lib/R/etc/Rprofile.site

      - name: Cache R packages
        id: cache-r
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/R/site-library
          key: tidyverse-4.4.0-pkgs-${{ hashFiles('.github/workflows/deploy.yml') }}

      - name: Thư viện hệ thống cho igraph (highcharter cần)
        timeout-minutes: 5
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libglpk40 libgmp10

      - name: Cài R packages (chỉ khi chưa có cache)
        timeout-minutes: 15
        if: steps.cache-r.outputs.cache-hit != 'true'
        run: |
          install.packages("pak")
          pak::pak(c(
            "highcharter", "formattable", "crosstalk", "reactable",
            "googlesheets4", "shiny", "htmlwidgets", "htmltools"
          ))
        shell: Rscript {0}

      - name: Render Quarto (luôn chạy lại code để lấy dữ liệu mới)
        run: |
          rm -rf _freeze _site
          quarto render
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Node (cho Netlify CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to Netlify
        run: |
          npx -y netlify-cli@27 deploy \
            --prod \
            --no-build \
            --dir _site \
            --functions netlify/functions \
            --site "$NETLIFY_SITE_ID" \
            --message "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}