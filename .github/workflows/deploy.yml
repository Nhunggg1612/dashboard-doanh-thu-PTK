name: Deploy Quarto to Netlify

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'   # 8:00 sáng giờ VN
    - cron: '0 7 * * *'   # 2:00 chiều
    - cron: '0 10 * * *'  # 5:00 chiều
  workflow_dispatch:

# Không cho 2 lượt chạy chồng nhau (bấm Run nhiều lần / trùng giờ lịch)
concurrency:
  group: deploy-netlify
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            libgdal-dev libgeos-dev libproj-dev libgit2-dev

      - name: Cache R packages
        id: cache-r
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-4.4.0-v1

      - name: Install R packages
        if: steps.cache-r.outputs.cache-hit != 'true'
        run: |
          install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable/")
          pak::pak(c(
            "dplyr", "tidyr", "tidyverse", "stringr", "stringi",
            "ggplot2", "ggthemes", "ggiraph", "highcharter", "formattable",
            "scales", "crosstalk", "reactable", "DT", "repr", "raster",
            "googlesheets4", "shiny", "shinydashboard", "shinyWidgets",
            "jsonlite", "htmlwidgets", "htmltools"
          ))
        shell: Rscript {0}

      - name: Render Quarto (luôn chạy lại code để lấy dữ liệu mới)
        run: |
          rm -rf _freeze _site
          quarto render
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Node (cho Netlify CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to Netlify
        run: |
          npx -y netlify-cli@27 deploy \
            --prod \
            --no-build \
            --dir _site \
            --functions netlify/functions \
            --site "$NETLIFY_SITE_ID" \
            --message "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
