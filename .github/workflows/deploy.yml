name: Deploy Quarto to Netlify

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'   # 8:00 sáng giờ VN
    - cron: '0 7 * * *'   # 2:00 chiều
    - cron: '0 10 * * *'  # 5:00 chiều
  workflow_dispatch:

# Không cho 2 lượt chạy chồng nhau (bấm Run nhiều lần / trùng giờ lịch)
concurrency:
  group: deploy-netlify
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Chạy trong image có sẵn R 4.4.0 -> bỏ hẳn bước "Setup R" (cài R mất ~4-5 phút)
    container: rocker/r-ver:4.4.0

    env:
      # Gói R dạng binary (cài nhanh, không phải biên dịch)
      CRAN_REPO: https://p3m.dev/cran/__linux__/jammy/latest
      QUARTO_VERSION: 1.7.32

    steps:
      - uses: actions/checkout@v4

      - name: Cài công cụ cơ bản + Quarto
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates
          curl -fsSL -o /tmp/quarto.deb \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.deb"
          dpkg -i /tmp/quarto.deb
          quarto --version
          echo "options(repos = c(CRAN = '${CRAN_REPO}'))" >> /usr/local/lib/R/etc/Rprofile.site

      - name: Cache R packages
        id: cache-r
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/R/site-library
          key: rocker-4.4.0-pkgs-${{ hashFiles('.github/workflows/deploy.yml') }}

      - name: Cài R packages (chỉ khi chưa có cache)
        if: steps.cache-r.outputs.cache-hit != 'true'
        run: |
          install.packages("pak")
          pak::pak(c(
            "rmarkdown", "knitr",
            "dplyr", "tidyr", "tidyverse", "stringr", "scales",
            "highcharter", "formattable", "crosstalk", "reactable",
            "googlesheets4", "shiny",
            "jsonlite", "htmlwidgets", "htmltools"
          ))
        shell: Rscript {0}

      - name: Cài thư viện hệ thống cho các gói R (khi dùng cache)
        if: steps.cache-r.outputs.cache-hit == 'true'
        run: pak::sysreqs_fix_installed()
        shell: Rscript {0}

      - name: Render Quarto (luôn chạy lại code để lấy dữ liệu mới)
        run: |
          rm -rf _freeze _site
          quarto render
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Node (cho Netlify CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to Netlify
        run: |
          npx -y netlify-cli@27 deploy \
            --prod \
            --no-build \
            --dir _site \
            --functions netlify/functions \
            --site "$NETLIFY_SITE_ID" \
            --message "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}