project:
  type: website
  output-dir: _site  # change to 'docs' if deploying to GitHub Pages

website:
  title: "Nguyễn Nhung"
  description: "Data • Visualization • R"
  favicon: images/favicon.png
  navbar:
    background: dark
    pinned: true
    left:
      - href: home.qmd
        text: TỔNG DỰ KIẾN DOANH THU
      - href: blog.qmd
        text: DỰ KIẾN DOANH THU THÁNG N
  page-footer:
    left: "© {2025} Nguyễn Thị Trang Nhung"
    right: "Data Analyst"

format:
  html:
    include-after-body:
      - text: |
          <script>
            (function () {
              var CHECK_INTERVAL = 60000; // kiểm tra mỗi 60 giây

              async function getLastBuild() {
                try {
                  var res = await fetch('/last-build.json?t=' + Date.now(), { cache: 'no-store' });
                  if (!res.ok) return null;             // chưa có file -> bỏ qua, không báo lỗi
                  var data = await res.json();
                  return data.buildTime || null;
                } catch (e) {
                  return null;
                }
              }

              (async function () {
                var initialBuild = await getLastBuild();
                if (!initialBuild) return;              // không có file build -> tắt tự reload
                setInterval(async function () {
                  var currentBuild = await getLastBuild();
                  if (currentBuild && currentBuild !== initialBuild) {
                    window.location.reload();
                  }
                }, CHECK_INTERVAL);
              })();
            })();
          </script>
    theme: cosmo
    css: styles.css
    toc: false
    smooth-scroll: true